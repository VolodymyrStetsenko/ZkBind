name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Run scanner smoke test
        run: |
          cargo run -p zkbind-cli -- scan fixtures --format json > zkbind-report.json
          python -m json.tool zkbind-report.json > /dev/null
          test "$(python -c 'import json; print(len(json.load(open("zkbind-report.json"))["findings"]))')" -ge 2
